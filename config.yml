# Galaxy Profile README Configuration
# Copy this file to config.yml and customize it to make it your own!
#
# Usage:
#   cp config.example.yml config.yml
#   # Edit config.yml with your details
#   python -m generator.main
#
# Demo mode (no API calls, uses this file directly):
#   python -m generator.main --demo

# Your GitHub username (required)
username: devRenanPaulino

# Profile information displayed in the galaxy header
profile:
  name: "Renan Paulino"
  tagline: "AI Engineer em formação | Python • Copilot SDK • Machine Learning • FastAPI • React"
  company: "VivoHost"
  location: "São Paulo, Brasil"
  bio: |
    Estagiário na VivoHost (Tech Enabler, diretoria de Finanças e Jurídico) e estudante de Análise e Desenvolvimento de Sistemas na FIAP.
    No trabalho, integrações com o Copilot SDK, React/Next.js e Python/FastAPI; na faculdade, Java/Spring Boot e Dart/Flutter.
    Busco unir estética, usabilidade e acessibilidade com arquitetura e qualidade de código.
  philosophy: '"Acredito que a programação é um meio — o verdadeiro impacto está na experiência que podemos transmitir."'

# Social links displayed at the bottom of the profile
social:
  email: "dev.renanpaulino@gmail.com"
  linkedin: "Renan Paulino"
  website: "https://devrenanpaulino.github.io/portifolio-renanpaulino/"

# Galaxy arms represent your core focus areas
# Each arm spirals out from the center with its own color and tech items
# Available colors: "synapse_cyan", "dendrite_violet", "axon_amber"
galaxy_arms:
  - name: "Frontend & Mobile"
    color: "synapse_cyan"
    items:
      - "React"
      - "Next.js"
      - "TypeScript"
      - "Tailwind"
      - "Flutter"
      - "Dart"
      - "UI/UX"
  - name: "Backend & Cloud"
    color: "dendrite_violet"
    items:
      - "Python"
      - "FastAPI"
      - "Java"
      - "Spring Boot"
      - "C# / .NET"
      - "Oracle SQL"
      - "Microservices"
      - "DevOps"
  - name: "AI & Data"
    color: "axon_amber"
    items:
      - "Machine Learning"
      - "scikit-learn"
      - "Jupyter"
      - "Copilot SDK"
      - "SDK Integrations"

# Featured projects shown as constellation stars
# Each project needs:
#   repo: "owner/repo-name"   — GitHub repository path
#   arm: 0-2                  — Which galaxy arm to associate with (index)
#   description: "..."        — Short description shown on the card
projects:
  - repo: "NexaGS/fe-nexa-app"
    arm: 0
    description: "App Flutter: tempo de espera em clínicas"
  - repo: "TdB-PlataformaRaizDoBem/Raiz-do-Bem"
    arm: 0
    description: "Front React/TS da plataforma Turma do Bem"
  - repo: "TdB-PlataformaRaizDoBem/ms-vulnerability-map"
    arm: 2
    description: "FastAPI + IBGE + ML: vulnerabilidade por UF"
  - repo: "devRenanPaulino/ms-sandbox-manager"
    arm: 1
    description: "FastAPI + Twilio: WhatsApp para a ONG"

# Mission log: timeline of milestones (up to 7). arm = galaxy arm index for the color
mission_log:
  - when: "2025 · 1º SEM"
    title: "PROPROFISSÃO"
    detail: "Programa de formação"
    arm: 0
  - when: "2025 · 2º SEM"
    title: "FIAP · ADS"
    detail: "Análise e Desenv. de Sistemas"
    arm: 1
  - when: "2025–26"
    title: "Raiz do Bem"
    detail: "React + MS WhatsApp"
    arm: 0
  - when: "2026 · ATUAL"
    title: "Challenge Amazul"
    detail: "FIAP · Spring Boot, .NET, Oracle"
    arm: 1
    current: true
  - when: "NOV 2026"
    title: "Nexa"
    detail: "Global Solution · Flutter"
    arm: 0

# Bug Hunt mini-game: labels of the bugs the ship squashes (3 to 6)
bug_hunt:
  bugs:
    - "NullPointer"
    - "undefined"
    - "CORS"
    - "404"
    - "Merge Conflict"

# Theme color overrides (optional — defaults to deep space palette)
# All values must be valid hex color codes (#RRGGBB)
theme:
  void: "#080c14" # Darkest background
  nebula: "#0f1623" # Card backgrounds
  star_dust: "#1a2332" # Borders, dividers
  synapse_cyan: "#00d4ff" # Primary accent (arm color 1)
  dendrite_violet: "#a78bfa" # Secondary accent (arm color 2)
  axon_amber: "#ffb020" # Tertiary accent (arm color 3)
  text_bright: "#f1f5f9" # Primary text
  text_dim: "#94a3b8" # Secondary text
  text_faint: "#64748b" # Muted text, labels

# Stats configuration — which metrics to show on the telemetry card
stats:
  metrics:
    - "commits"
    - "stars"
    - "prs"
    - "issues"
    - "repos"

# Organizations whose public repos count toward the languages chart
organizations:
  - "TdB-PlataformaRaizDoBem"
  - "NexaGS"
  - "CHALLENGE-AMAZUL"

# Language display settings
languages:
  exclude: # Languages to hide from the telemetry chart
    - "HTML"
    - "CSS"
    - "Shell"
    - "Makefile"
    - "Mermaid"
  max_display: 8 # Maximum number of languages to show
