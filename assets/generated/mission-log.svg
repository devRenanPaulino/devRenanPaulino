<svg xmlns="http://www.w3.org/2000/svg" width="850" height="220" viewBox="0 0 850 220">
  <defs>
    <filter id="ship-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <linearGradient id="track-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="849" height="219" rx="12" ry="12"
        fill="#0f1623" stroke="#1a2332" stroke-width="1"/>
  <g opacity="0.4" fill="none" stroke="#64748b" stroke-width="1.5">
    <polyline points="5,21 5,5 21,5"/>
    <polyline points="829,5 845,5 845,21"/>
    <polyline points="5,199 5,215 21,215"/>
    <polyline points="829,215 845,215 845,199"/>
  </g>

  <text x="30" y="38" fill="#64748b" font-size="11" font-family="monospace" letter-spacing="3">MISSION LOG</text>
  <text x="820" y="38" fill="#64748b" font-size="10" font-family="monospace"
        text-anchor="end" opacity="0.5">5 CHECKPOINTS</text>

  <!-- Track -->
  <line x1="78" y1="112" x2="772" y2="112" stroke="#1a2332" stroke-width="2" stroke-dasharray="2,6" stroke-linecap="round"/>
  <line x1="78" y1="112" x2="78" y2="112" stroke="url(#track-grad)" stroke-width="2" stroke-linecap="round">
    <animate attributeName="x2" keyTimes="0;0.85;0.97;1" values="78;772;772;78" dur="12.0s" repeatCount="indefinite"/>
  </line>

  <!-- Checkpoints -->
  <g>
    <text x="78.0" y="84" fill="#00d4ff" font-size="11" font-family="monospace"
          letter-spacing="1" text-anchor="middle" opacity="0.9">2025 · 1º SEM</text>
    <line x1="78.0" y1="92" x2="78.0" y2="103" stroke="#00d4ff" stroke-width="1" opacity="0.35"/>
    <circle cx="78.0" cy="112" r="9" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="8;13;8" dur="3.2s" begin="-0.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.05;0.5" dur="3.2s" begin="-0.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="78.0" cy="112" r="5" fill="#00d4ff" opacity="0.25">
      <animate attributeName="opacity" keyTimes="0;0.0050;0.0250;0.97;1" values="0.25;0.25;1;1;0.25" dur="12.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="78.0" cy="112" r="1.8" fill="#ffffff" opacity="0.9"/>
    <text x="78.0" y="148" fill="#f1f5f9" font-size="12" font-weight="bold"
          font-family="sans-serif" text-anchor="middle">PROPROFISSÃO</text>
    <text x="78.0" y="166" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Programa de formação</text>
  </g>
  <g>
    <text x="251.5" y="84" fill="#a78bfa" font-size="11" font-family="monospace"
          letter-spacing="1" text-anchor="middle" opacity="0.9">2025 · 2º SEM</text>
    <line x1="251.5" y1="92" x2="251.5" y2="103" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
    <circle cx="251.5" cy="112" r="9" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="8;13;8" dur="3.2s" begin="-0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.05;0.5" dur="3.2s" begin="-0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="251.5" cy="112" r="5" fill="#a78bfa" opacity="0.25">
      <animate attributeName="opacity" keyTimes="0;0.2175;0.2375;0.97;1" values="0.25;0.25;1;1;0.25" dur="12.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="251.5" cy="112" r="1.8" fill="#ffffff" opacity="0.9"/>
    <text x="251.5" y="148" fill="#f1f5f9" font-size="12" font-weight="bold"
          font-family="sans-serif" text-anchor="middle">FIAP · ADS</text>
    <text x="251.5" y="166" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Análise e Desenv. de</text>
    <text x="251.5" y="180" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Sistemas</text>
  </g>
  <g>
    <text x="425.0" y="84" fill="#00d4ff" font-size="11" font-family="monospace"
          letter-spacing="1" text-anchor="middle" opacity="0.9">2025–26</text>
    <line x1="425.0" y1="92" x2="425.0" y2="103" stroke="#00d4ff" stroke-width="1" opacity="0.35"/>
    <circle cx="425.0" cy="112" r="9" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="8;13;8" dur="3.2s" begin="-1.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.05;0.5" dur="3.2s" begin="-1.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="425.0" cy="112" r="5" fill="#00d4ff" opacity="0.25">
      <animate attributeName="opacity" keyTimes="0;0.4300;0.4500;0.97;1" values="0.25;0.25;1;1;0.25" dur="12.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="425.0" cy="112" r="1.8" fill="#ffffff" opacity="0.9"/>
    <text x="425.0" y="148" fill="#f1f5f9" font-size="12" font-weight="bold"
          font-family="sans-serif" text-anchor="middle">Raiz do Bem</text>
    <text x="425.0" y="166" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">React + MS WhatsApp</text>
  </g>
  <g>
    <text x="598.5" y="84" fill="#a78bfa" font-size="11" font-family="monospace"
          letter-spacing="1" text-anchor="middle" opacity="0.9">2026 · ATUAL</text>
    <line x1="598.5" y1="92" x2="598.5" y2="103" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
    <circle cx="598.5" cy="112" r="9" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="8;13;8" dur="3.2s" begin="-1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.05;0.5" dur="3.2s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="598.5" cy="112" r="6" fill="none" stroke="#a78bfa" stroke-width="1.5">
      <animate attributeName="r" values="6;20;6" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="598.5" cy="112" r="5" fill="#a78bfa" opacity="0.25">
      <animate attributeName="opacity" keyTimes="0;0.6425;0.6625;0.97;1" values="0.25;0.25;1;1;0.25" dur="12.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="598.5" cy="112" r="1.8" fill="#ffffff" opacity="0.9"/>
    <text x="598.5" y="148" fill="#f1f5f9" font-size="12" font-weight="bold"
          font-family="sans-serif" text-anchor="middle">Challenge Amazul</text>
    <text x="598.5" y="166" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">FIAP · Spring Boot,</text>
    <text x="598.5" y="180" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">.NET, Oracle</text>
  </g>
  <g>
    <text x="772.0" y="84" fill="#00d4ff" font-size="11" font-family="monospace"
          letter-spacing="1" text-anchor="middle" opacity="0.9">NOV 2026</text>
    <line x1="772.0" y1="92" x2="772.0" y2="103" stroke="#00d4ff" stroke-width="1" opacity="0.35"/>
    <circle cx="772.0" cy="112" r="9" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="8;13;8" dur="3.2s" begin="-2.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.05;0.5" dur="3.2s" begin="-2.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="772.0" cy="112" r="5" fill="#00d4ff" opacity="0.25">
      <animate attributeName="opacity" keyTimes="0;0.8550;0.8750;0.97;1" values="0.25;0.25;1;1;0.25" dur="12.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="772.0" cy="112" r="1.8" fill="#ffffff" opacity="0.9"/>
    <text x="772.0" y="148" fill="#f1f5f9" font-size="12" font-weight="bold"
          font-family="sans-serif" text-anchor="middle">Nexa</text>
    <text x="772.0" y="166" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Global Solution ·</text>
    <text x="772.0" y="180" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Flutter</text>
  </g>

  <!-- Probe travelling along the log -->
  <g>
    <animateMotion path="M78,112 L772,112" keyPoints="0;1;1" keyTimes="0;0.85;1" calcMode="linear" dur="12.0s" repeatCount="indefinite"/>
    <circle r="8" fill="#00d4ff" opacity="0.5" filter="url(#ship-glow)"/>
    <circle r="3" fill="#ffffff"/>
  </g>
</svg>